<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Hills They Held</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #05070a;
           font-family: "DejaVu Serif", Georgia, serif; color: #f3ead6; }
  canvas { position: absolute; inset: 0; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,.82) 0%, rgba(0,0,0,.5) 16%, rgba(0,0,0,0) 34%),
      linear-gradient(to bottom, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 26%),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,.6) 100%); }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .label { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; text-align: center;
    font-family: "Liberation Sans", "DejaVu Sans", Arial, sans-serif; font-weight: 700;
    letter-spacing: .22em; font-size: 22px; color: #d9d2c0; text-shadow: 0 2px 8px #000, 0 0 2px #000; }
  .label.home { color: #ffd27a; font-size: 34px; letter-spacing: .3em; }
  .label.place { font-size: 25px; letter-spacing: .1em; font-weight: 400; color: #fff; }
  .label.place::before { content: ""; display: block; width: 9px; height: 9px; margin: 0 auto 6px;
    border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
  .label.fort { color: #ff6b5a; }
  .label.gold { color: #ffd27a; }
  #date { position: absolute; left: 96px; top: 84px; font-size: 76px; font-weight: 700; letter-spacing: .04em;
    text-shadow: 0 4px 24px #000; }
  #dateSub { position: absolute; left: 100px; top: 180px; font-family: "Liberation Sans", Arial, sans-serif;
    font-size: 27px; letter-spacing: .34em; color: #ff6b5a; text-shadow: 0 2px 10px #000; }
  #caption { position: absolute; left: 0; right: 0; bottom: 104px; text-align: center; font-size: 39px;
    line-height: 1.4; padding: 0 240px; text-shadow: 0 2px 14px #000, 0 0 3px #000; }
  #title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; }
  #title h1 { margin: 0; font-size: 120px; letter-spacing: .12em; font-weight: 700; text-shadow: 0 6px 40px #000; }
  #title p { margin: 26px 0 0; font-family: "Liberation Sans", Arial, sans-serif; font-size: 31px;
    letter-spacing: .4em; color: #ffd27a; text-shadow: 0 2px 12px #000; }
  #note { position: absolute; right: 40px; bottom: 30px; font-family: "Liberation Sans", Arial, sans-serif;
    font-size: 15px; letter-spacing: .12em; color: rgba(255,255,255,.42); }
  #fade { position: absolute; inset: 0; background: #000; pointer-events: none; }
</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="vignette"></div>
  <div id="labels"></div>
  <div id="date"></div><div id="dateSub"></div>
  <div id="caption"></div>
  <div id="title"><h1>THE HILLS THEY HELD</h1><p>THE MIZO DEFENCE OF THE LUSHAI HILLS</p></div>
  <div id="note">STYLISED MAP · NOT TO SCALE</div>
  <div id="fade"></div>
</div>
<script type="module" src="./scene.js"></script>
</body>
</html>
