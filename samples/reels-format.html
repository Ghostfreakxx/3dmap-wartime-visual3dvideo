<!doctype html>
<html><head><meta charset="utf-8"><title>Reels Format Sample</title>
<style>html,body{margin:0;background:#000}canvas{display:block;margin:auto;max-height:100vh}</style></head>
<body><canvas id="c" width="720" height="1280"></canvas>
<script>
// Sample of the vertical "history reel" format: dark red backdrop, stepped white title box,
// 16:9 hand-drawn stick-figure scene in the middle. Everything is drawn with Canvas 2D.
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 720, H = 1280, PX = 0, PY = 390, PW = 720, PH = 405; // scene panel
const DUR = 10;
const INK = '#141110';

// --- hand-drawn helpers ("boiling" lines: wobble changes 8x per second)
let boil = 0;
const hash = (n) => { const s = Math.sin(n * 127.1 + boil * 311.7) * 43758.5453; return s - Math.floor(s); };
const wob = (i, a = 1.2) => (hash(i) - 0.5) * 2 * a;
function path(pts, close = false, seed = 0) {
  g.beginPath();
  pts.forEach(([x, y], i) => { const X = x + wob(seed + i * 2), Y = y + wob(seed + i * 2 + 1); i ? g.lineTo(X, Y) : g.moveTo(X, Y); });
  if (close) g.closePath();
}
function stroke(pts, w = 5, col = INK, seed = 0) { path(pts, false, seed); g.lineWidth = w; g.strokeStyle = col; g.lineCap = g.lineJoin = 'round'; g.stroke(); }
function blob(cx, cy, rx, ry, fill, w = 4, seed = 0, n = 22) {
  const pts = []; for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2; pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); }
  path(pts, true, seed); if (fill) { g.fillStyle = fill; g.fill(); } if (w) { g.lineWidth = w; g.strokeStyle = INK; g.stroke(); }
}

// --- a big-headed character
// o: { skin, hair: 'knot'|'turban'|'pith'|'bald', brows: angle, mouth: 0..1 open, look: [-1..1], beard, eyeBig: 1.0..1.5 }
function head(x, y, r, o = {}, seed = 0) {
  const skin = o.skin ?? '#f4ede2';
  if (o.hair === 'knot') { blob(x + r * 0.55 * (o.facing ?? 1) * -1, y - r * 0.15, r * 0.32, r * 0.3, '#1a1412', 4, seed + 9); }
  blob(x, y, r, r * 1.12, skin, 5, seed);
  if (o.hair === 'knot' || o.hair === 'turban') {
    g.save(); path(Array.from({ length: 16 }, (_, i) => { const a = Math.PI + (i / 15) * Math.PI; return [x + Math.cos(a) * r * 1.02, y + Math.sin(a) * r * 1.12 + r * 0.1]; }), false, seed + 3);
    g.lineTo(x + r, y - r * 0.15); g.lineTo(x - r, y - r * 0.15); g.closePath();
    g.fillStyle = o.hair === 'turban' ? '#f2efe6' : '#1a1412'; g.fill(); g.lineWidth = 4; g.strokeStyle = INK; g.stroke(); g.restore();
    if (o.hair === 'turban') { stroke([[x - r, y - r * 0.35], [x + r, y - r * 0.55]], 4, '#b3282d', seed + 5); }
  }
  if (o.hair === 'pith') {
    blob(x, y - r * 0.55, r * 1.05, r * 0.7, '#f1ead8', 5, seed + 7);
    blob(x, y - r * 0.25, r * 1.45, r * 0.18, '#e6ddc6', 5, seed + 8);
  }
  if (o.beard) blob(x, y + r * 0.62, r * 0.75, r * 0.5, o.beard, 4, seed + 11);
  // eyes (comically uneven)
  const look = (o.look ?? 0) * r * 0.12;
  [[-0.38, 1], [0.36, o.eyeBig ?? 1.25]].forEach(([dx, s], k) => {
    blob(x + dx * r, y - r * 0.08, r * 0.2 * s, r * 0.24 * s, '#fff', 4, seed + 20 + k * 5, 14);
    blob(x + dx * r + look, y - r * 0.05, r * 0.07 * s, r * 0.08 * s, INK, 0, seed + 30 + k, 10);
  });
  const ba = o.brows ?? 0.4; // positive = angry
  stroke([[x - r * 0.62, y - r * 0.38 - ba * r * 0.12], [x - r * 0.18, y - r * 0.3 + ba * r * 0.12]], 6, INK, seed + 40);
  stroke([[x + r * 0.12, y - r * 0.3 + ba * r * 0.12], [x + r * 0.66, y - r * 0.42 - ba * r * 0.12]], 6, INK, seed + 42);
  // mouth
  const m = o.mouth ?? 0;
  if (m > 0.05) {
    blob(x + r * 0.05, y + r * 0.42, r * 0.32, r * 0.08 + r * 0.26 * m, '#7a1d1d', 4, seed + 50, 16);
    g.fillStyle = '#fff'; g.fillRect(x - r * 0.2, y + r * 0.42 - (r * 0.08 + r * 0.26 * m) + 3, r * 0.5, r * 0.09);
  } else stroke([[x - r * 0.25, y + r * 0.45], [x + r * 0.05, y + r * 0.4], [x + r * 0.3, y + r * 0.46]], 5, INK, seed + 52);
  if (o.mustache) stroke([[x - r * 0.35, y + r * 0.3], [x, y + r * 0.22], [x + r * 0.4, y + r * 0.3]], 7, '#2a1a12', seed + 55);
}
// stick body below a head. arms/legs are angles in radians from straight down.
function body(x, y, s, p = {}, seed = 0) {
  const neck = [x, y], hip = [x, y + 60 * s];
  stroke([neck, hip], 6 * s, INK, seed);
  const limb = (o, a, len) => [o[0] + Math.sin(a) * len * s, o[1] + Math.cos(a) * len * s];
  const sh = [x, y + 12 * s];
  const hl = limb(sh, p.armL ?? 0.5, 48), hr = limb(sh, p.armR ?? -0.5, 48);
  stroke([sh, limb(sh, (p.armL ?? 0.5) * 0.8, 26), hl], 5.5 * s, INK, seed + 3);
  stroke([sh, limb(sh, (p.armR ?? -0.5) * 0.8, 26), hr], 5.5 * s, INK, seed + 6);
  stroke([hip, limb(hip, p.legL ?? 0.3, 30), limb(hip, (p.legL ?? 0.3) * 0.6, 58)], 6 * s, INK, seed + 9);
  stroke([hip, limb(hip, p.legR ?? -0.3, 30), limb(hip, (p.legR ?? -0.3) * 0.6, 58)], 6 * s, INK, seed + 12);
  if (p.cloth) { path([[x - 14 * s, y + 52 * s], [x + 14 * s, y + 52 * s], [x + 18 * s, y + 74 * s], [x - 18 * s, y + 74 * s]], true, seed + 15); g.fillStyle = p.cloth; g.fill(); g.lineWidth = 3; g.strokeStyle = INK; g.stroke(); }
  if (p.coat) { path([[x - 16 * s, y + 4 * s], [x + 16 * s, y + 4 * s], [x + 18 * s, y + 62 * s], [x - 18 * s, y + 62 * s]], true, seed + 16); g.fillStyle = p.coat; g.fill(); g.lineWidth = 3; g.strokeStyle = INK; g.stroke(); stroke([[x - 14 * s, y + 8 * s], [x + 14 * s, y + 56 * s]], 3 * s, '#fff', seed + 17); stroke([[x + 14 * s, y + 8 * s], [x - 14 * s, y + 56 * s]], 3 * s, '#fff', seed + 18); }
  return { hl, hr };
}
function dao(hx, hy, ang, s = 1, seed = 0) {
  const dx = Math.sin(ang), dy = -Math.cos(ang), nx = -dy, ny = dx;
  const p = (a, b) => [hx + dx * a * s + nx * b * s, hy + dy * a * s + ny * b * s];
  stroke([p(-10, 0), p(14, 0)], 7 * s, '#6b4a2b', seed);
  path([p(14, -4), p(62, -6), p(74, -11), p(76, 6), p(14, 5)], true, seed + 3);
  g.fillStyle = '#d9dee4'; g.fill(); g.lineWidth = 3.5; g.strokeStyle = INK; g.stroke();
}
function rifle(hx, hy, ang, s = 1, seed = 0) {
  const dx = Math.sin(ang), dy = -Math.cos(ang);
  stroke([[hx - dx * 20 * s, hy - dy * 20 * s], [hx + dx * 50 * s, hy + dy * 50 * s]], 5 * s, '#6b4a2b', seed);
  stroke([[hx + dx * 50 * s, hy + dy * 50 * s], [hx + dx * 66 * s, hy + dy * 66 * s]], 2.5 * s, '#c9d0d8', seed + 2);
}

// --- scenes (local time u in seconds)
function sceneChief(u) {
  g.fillStyle = '#c9a86a'; g.fillRect(0, 0, PW, PH);
  for (let x = 0; x < PW; x += 34) stroke([[x, 0], [x + 3, PH * 0.72]], 3, 'rgba(90,60,30,.5)', x);
  g.fillStyle = '#8a6a44'; g.fillRect(0, PH * 0.72, PW, PH);
  stroke([[0, PH * 0.72], [PW, PH * 0.72]], 4, INK, 1);
  // mithun skull trophy on the wall
  blob(PW / 2, 70, 34, 26, '#efe6d2', 4, 70); stroke([[PW / 2 - 30, 60], [PW / 2 - 70, 30]], 9, INK, 71); stroke([[PW / 2 + 30, 60], [PW / 2 + 70, 30]], 9, INK, 72);
  blob(PW / 2 - 12, 68, 6, 6, INK, 0, 73); blob(PW / 2 + 12, 68, 6, 6, INK, 0, 74);
  // stool + chief
  path([[300, 300], [420, 300], [410, 340], [310, 340]], true, 80); g.fillStyle = '#6b4a2b'; g.fill(); g.lineWidth = 4; g.strokeStyle = INK; g.stroke();
  const talk = Math.abs(Math.sin(u * 11)) * (u % 1.6 < 1.2 ? 1 : 0);
  body(360, 230, 1, { armL: 1.4 + 0.3 * Math.sin(u * 4), armR: -0.6, legL: 0.9, legR: -0.9, cloth: '#2a2626' }, 90);
  head(360, 178, 62, { skin: '#e8c49c', hair: 'turban', brows: 0.6, mouth: 0.2 + talk * 0.7, look: Math.sin(u * 2), eyeBig: 1.3 }, 100);
  // nervous warriors on both sides
  [[90, -1], [200, -1], [520, 1], [630, 1]].forEach(([x, side], i) => {
    body(x, 255, 0.9, { armL: 0.2, armR: -0.2, legL: 0.2, legR: -0.2, cloth: '#2a2626' }, 200 + i * 20);
    head(x, 205, 46, { skin: '#e8c49c', hair: 'knot', facing: side, brows: -0.5, mouth: 0, look: -side * 0.8, eyeBig: 1.4 }, 300 + i * 30);
  });
}
function hills(colTop, colMid, colLow) {
  g.fillStyle = '#9fd0ea'; g.fillRect(0, 0, PW, PH);
  blob(150, 60, 90, 26, '#fff', 0, 900); blob(520, 45, 110, 30, '#fff', 0, 901);
  const ridge = (yb, amp, f, col, seed) => { const pts = [[0, PH]]; for (let x = 0; x <= PW; x += 24) pts.push([x, yb - amp * Math.sin(x * f + seed)]); pts.push([PW, PH]); path(pts, true, seed); g.fillStyle = col; g.fill(); g.lineWidth = 3; g.strokeStyle = INK; g.stroke(); };
  ridge(190, 30, 0.012, colTop, 3); ridge(250, 22, 0.018, colMid, 7); ridge(330, 14, 0.02, colLow, 11);
}
function sceneColumn(u) {
  hills('#7fae6a', '#5f9a48', '#4a8236');
  // redcoat column marching along the middle ridge
  for (let i = 0; i < 16; i++) {
    const x = ((u * 38 + i * 34) % (PW + 200)) - 100, y = 236 - 22 * Math.sin(x * 0.018 + 7);
    const st = Math.sin(u * 10 + i);
    body(x, y - 22, 0.32, { armL: 0.2, armR: -0.3, legL: 0.35 * st, legR: -0.35 * st, coat: '#c0262b' }, 500 + i * 10);
    head(x, y - 34, 13, { hair: 'pith', mouth: 0, brows: -0.2 }, 600 + i * 10);
  }
  // foreground: warriors yelling from the bushes
  for (let i = 0; i < 5; i++) blob(70 + i * 150, 375, 110, 60, i % 2 ? '#3f7a2e' : '#4a8a34', 4, 700 + i);
  [[150, -1, 0.3], [560, 1, 0.9]].forEach(([x, side, ph], i) => {
    const shout = 0.5 + 0.5 * Math.abs(Math.sin(u * 7 + ph));
    head(x, 300, 66, { skin: '#e8c49c', hair: 'knot', facing: side, brows: 1, mouth: shout, look: side * -0.6 }, 800 + i * 40);
    dao(x + side * 70, 330, side * 0.4 + 0.25 * Math.sin(u * 9 + ph), 1.3, 850 + i);
  });
}
function sceneCharge(u) {
  g.fillStyle = '#e9d9a8'; g.fillRect(0, 0, PW, PH);
  for (let i = 0; i < 22; i++) { const y = (i * 37 + u * 900) % PH; stroke([[0, y], [PW, y + 8]], 3, 'rgba(120,90,40,.35)', i); } // speed lines
  const run = Math.sin(u * 14), bob = Math.abs(Math.cos(u * 14)) * 10;
  const { hr } = body(380, 250 - bob, 1.5, { armL: 1.0 * run, armR: -2.3, legL: 0.9 * run, legR: -0.9 * run, cloth: '#2a2626' }, 1000);
  dao(hr[0], hr[1], -0.9 + 0.15 * Math.sin(u * 20), 1.6, 1010);
  head(380, 175 - bob, 88, { skin: '#e8c49c', hair: 'knot', facing: 1, brows: 1.2, mouth: 0.9 + 0.1 * Math.sin(u * 30), look: 1 }, 1100);
  // a nervous redcoat in the corner
  const scared = Math.min(1, u / 0.8);
  head(640 - 30 * scared, 300, 56, { hair: 'pith', brows: -0.8, mouth: 0.6 * scared, look: -1, eyeBig: 1.6 }, 1200);
}

const SHOTS = [[0, 3.6, sceneChief], [3.6, 7.0, sceneColumn], [7.0, 10, sceneCharge]];
const TITLE = ['Mizo Warriors vs The', 'Empire | Lushai Hills', '1890. Pt 1'];

function frame(t) {
  boil = Math.floor(t * 8);
  // backdrop
  const bg = g.createRadialGradient(W / 2, H * 0.62, 40, W / 2, H * 0.62, H * 0.75);
  bg.addColorStop(0, '#8e2a33'); bg.addColorStop(0.55, '#5a1820'); bg.addColorStop(1, '#2a0a0e');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  // scene panel with a slow push-in
  const [s0, s1, fn] = SHOTS.find(([a, b]) => t >= a && t < b) ?? SHOTS[SHOTS.length - 1];
  const u = t - s0, z = 1 + 0.04 * (u / (s1 - s0));
  g.save(); g.beginPath(); g.rect(PX, PY, PW, PH); g.clip();
  g.translate(PX + PW / 2, PY + PH / 2); g.scale(z, z); g.translate(-PW / 2, -PH / 2);
  fn(u);
  g.restore();
  // hard cut flash
  const sinceCut = u; if (sinceCut < 0.08) { g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(PX, PY, PW, PH); }
  // stepped title box
  g.font = '700 46px "DejaVu Sans", Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  const lh = 64, top = 222;
  TITLE.forEach((line, i) => {
    const w = g.measureText(line).width + 40, y = top + i * lh;
    g.fillStyle = '#fff'; g.beginPath(); g.roundRect(W / 2 - w / 2, y - lh / 2 - 2, w, lh + 4, 12); g.fill();
  });
  g.fillStyle = '#111';
  TITLE.forEach((line, i) => g.fillText(line, W / 2, top + i * lh + 2));
  // fade in / out
  const f = Math.max(0, 1 - t / 0.4, (t - DUR + 0.5) / 0.5);
  if (f > 0) { g.fillStyle = `rgba(0,0,0,${f})`; g.fillRect(0, 0, W, H); }
}
window.__frame = (t) => { frame(t); return cv.toDataURL('image/jpeg', 0.92); };
window.DUR = DUR;
if (!location.search.includes('still')) { const t0 = performance.now(); (function loop() { frame(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })(); }
</script></body></html>
