<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wartime visual</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d0d0f; color: #ddd; font: 14px system-ui, sans-serif; overflow: hidden; }
      #wrap { height: calc(100% - 64px); display: flex; justify-content: center; align-items: flex-start; }
      #stage { position: relative; transform-origin: top center; flex: none; }
      #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      #controls { height: 64px; display: flex; gap: 12px; align-items: center; padding: 0 16px; box-sizing: border-box; }
      #controls input[type=range] { flex: 1; }
      #controls button, #controls select { background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 6px 12px; }
      #time { font-variant-numeric: tabular-nums; min-width: 9em; text-align: right; }
      body.render #controls { display: none; }
      body.render #wrap { height: auto; display: block; }
      body.render #stage { transform: none !important; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="stage">
        <canvas id="gl"></canvas>
        <canvas id="map"></canvas>
        <canvas id="overlay"></canvas>
      </div>
    </div>
    <div id="controls">
      <button id="play">Play</button>
      <input id="scrub" type="range" min="0" step="0.01" value="0" />
      <span id="time"></span>
      <select id="scene"></select>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
